name: Build Auto Decorator

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android armv7
            os: ubuntu-latest
            target: Android32
          - name: Android arm64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          # "given" = build against the exact Geode version in mod.json (5.11.2, GD 2.2081).
          # Do NOT use "latest"/"nightly": they now resolve to Geode v6 (GD 2.2091).
          sdk: given
          # geode-sdk/bindings main currently fails to build GD 2.2081
          # (geode-sdk/bindings PR #1390). This pins the PR's fix to an exact commit.
          # Remove these two lines once that PR is merged upstream.
          bindings: vwtfafa/bindings
          bindings-ref: c0c808828d456e54164b60a589b0edd6172b327a
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDecorator-geode
          path: ${{ steps.build.outputs.build-output }}
